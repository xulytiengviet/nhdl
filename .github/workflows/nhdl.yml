name: NHDL verify and publish
on:
  push:
    branches: [master]
    paths: ['nhdl/**', '.github/workflows/nhdl.yml', 'index.html', 'studio.html']
  pull_request:
    paths: ['nhdl/**', '.github/workflows/nhdl.yml', 'index.html', 'studio.html']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nhdl-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ghdl
      - run: make -C nhdl synth
      - run: make -C nhdl state
      - run: node --test nhdl/tests/web.test.cjs nhdl/tests/bridge.test.mjs nhdl/tests/state.test.mjs nhdl/tests/challenges.test.mjs
      - run: node nhdl/tools/nhdlc.mjs nhdl/examples/tong.bila --out nhdl/build/generated --verify
      - uses: actions/upload-artifact@v4
        with:
          name: nhdl-simulation
          path: nhdl/build/
      - name: Stage stable Pages layout
        run: |
          mkdir -p nhdl/build/pages/nhdl
          cp -R nhdl/site nhdl/build/pages/nhdl/site
          cp index.html studio.html nhdl/build/pages/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: nhdl/build/pages
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
